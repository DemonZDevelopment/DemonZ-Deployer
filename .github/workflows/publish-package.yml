name: "Master Release Engine (v3.0.1)"

on:
  push:
    branches: [ main ]
    paths: [ 'package.json' ] # Only fires when you bump the version

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@demonzdevelopment'

      - name: Generate Automatic Fix Summary
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.0.3")
          SUMMARY=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"* %s")
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Professional Assets
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          zip -r "dist/demonz-deployer-v${VERSION}.zip" . -x "*.git*" "dist/*" ".DS_Store"
          tar -czvf "dist/demonz-deployer-v${VERSION}.tar.gz" --exclude='.git' --exclude='dist' .
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }} — Command Center
          body: |
            ## 🚀 DemonZ Deployer v${{ env.VERSION }} — "Command Center"

            ### Patch Fixes (v3.0.1)
            - **readEntries truncation fix** — dropped folders with 100+ files are now fully read (looping readEntries)
            - **Worker client_id validation** — the Cloudflare Worker now rejects requests with an unexpected client_id
            - **KV namespace documentation** — deploy instructions document the optional RATE_LIMIT KV binding for persistent cross-instance rate limiting
            - **90 MB upload hard limit** — files exceeding 90 MB are rejected before encoding (GitHub Contents API max is 100 MB)
            - **listBranches pagination** — repos with 100+ branches are now fully loaded via paginated fetch

            ### Changelog
            ${{ steps.changelog.outputs.summary }}

            ---
            *Forging Digital Empires — DemonZ Development*
          files: |
            dist/*.zip
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
